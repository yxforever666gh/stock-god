[project]
name = "stock-god"
version = "7.1.0"
description = "Stock prediction and market data services"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "mcp>=1.8,<2",
  "tzdata>=2025.1",
  "beautifulsoup4>=4.13,<5",
  "lxml>=5,<7",
  "jieba>=0.42.1,<1",
  "jsonschema>=4.23,<5",
  "akshare>=1.17,<2",
  "scikit-learn==1.7.2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "pyright>=1.1,<2",
  "playwright>=1.52,<2",
  "aiosmtpd>=1.4,<2",
]

[project.scripts]
stock-god = "stock_god.cli:main"
stock-god-minute-api = "stock_god.market.minute_app:main"
stock-god-tunnel = "stock_god.market.tunnel:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_god"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "live: explicitly opted-in external provider tests",
  "migration: historical database upgrade tests",
  "browser: isolated browser end-to-end tests",
]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/stock_god"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
