openapi: 3.1.0
info: {title: Stock God Local Web API, version: 2.0.0, description: 'Local stock prediction, retained market data,
    settings and audit APIs.'}
servers:
- {url: 'http://127.0.0.1:34115'}
paths:
  /livez:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivenessStatus'}
  /readyz:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemVersionStatus'}
        '503':
          description: Not ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemVersionStatus'}
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      responses:
        '200':
          description: Display version information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemInfo'}
  /api/v1/system/shutdown:
    post:
      operationId: shutdownSystem
      responses:
        '200':
          description: Shutdown requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        '200': {description: Settings}
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JsonObject'}
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/prediction/ai/configs:
    get:
      operationId: listPredictionAIConfigs
      responses:
        '200': {description: Enabled models belonging to the requested center}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/prediction/settings:
    get:
      operationId: getPredictionSettings
      responses:
        '200':
          description: Independent research configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
    put:
      operationId: updatePredictionSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PredictionSettings'}
      responses:
        '200':
          description: Saved configuration and new revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/prediction/ai/configs/test:
    post:
      operationId: testPredictionAIConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIConfigTestRequest'}
      responses:
        '200': {description: AI configuration test result}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/stocks/search:
    get:
      operationId: searchStockMaster
      responses:
        '200': {description: Stock master search}
  /api/v1/stocks/query:
    post:
      operationId: queryStocks
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StockQueryRequest'}
      responses:
        '200': {description: Indicator stock query}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/stocks/{code}/snapshot:
    get:
      operationId: getStockSnapshot
      responses:
        '200': {description: Stock snapshot}
  /api/v1/stocks/{code}/kline:
    get:
      operationId: getStockKLine
      responses:
        '200': {description: Stock daily bars}
  /api/v1/stocks/{code}/minute-line:
    get:
      operationId: getStockMinuteLine
      responses:
        '200': {description: Stock minute line}
  /api/v1/funds/search:
    get:
      operationId: searchFunds
      responses:
        '200': {description: Fund search}
  /api/v1/funds/rankings:
    get:
      operationId: fundRankings
      parameters:
      - name: category
        in: query
        schema:
          type: string
          enum: [all, stock, mixed, bond, index, qdii, fof]
      - name: period
        in: query
        schema:
          type: string
          enum: [day, week, month, 3m, 6m, 1y, 3y, ytd, since_inception, scale]
      - name: q
        in: query
        schema: {type: string}
      - name: sortDirection
        in: query
        schema:
          type: string
          enum: [asc, desc]
      - name: page
        in: query
        schema: {type: integer, minimum: 1}
      - name: pageSize
        in: query
        schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Off-exchange fund rankings with normalized NAV date and provider state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FundRankingEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/etfs/rankings:
    get:
      operationId: etfRankings
      parameters:
      - name: category
        in: query
        schema:
          type: string
          enum: [all, broad, industry, cross_border, bond, commodity, money]
      - name: q
        in: query
        schema: {type: string}
      - name: sort
        in: query
        schema:
          type: string
          enum: [changeRate, amount, turnoverRate, premiumRate, scale, netInflow]
      - name: sortDirection
        in: query
        schema:
          type: string
          enum: [asc, desc]
      - name: page
        in: query
        schema: {type: integer, minimum: 1}
      - name: pageSize
        in: query
        schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Exchange-traded-fund rankings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ETFRankingEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/etfs/search:
    get:
      operationId: etfSearch
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 50}
      responses:
        '200':
          description: Search listed exchange-traded funds by normalized code or name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ETFSearchEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/etfs/{code}:
    get:
      operationId: etfDetail
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Exchange-traded-fund identity
          quote: null
          NAV: null
          scale: null
          flow and holdings: null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ETFDetailEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/market/telegraphs:
    get:
      operationId: listTelegraphs
      responses:
        '200': {description: Telegraphs}
  /api/v1/market/telegraphs/refresh:
    post:
      operationId: refreshTelegraphs
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelegraphRefreshRequest'}
      responses:
        '200': {description: Telegraphs refreshed}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/market/indexes/global:
    get:
      operationId: getGlobalIndexes
      responses:
        '200': {description: Global indexes}
  /api/v1/market/industries/rank:
    get:
      operationId: getIndustryRank
      responses:
        '200': {description: Industry rank}
  /api/v1/market/industries/money-rank:
    get:
      operationId: getIndustryMoneyRank
      responses:
        '200': {description: Industry money rank}
  /api/v1/market/stocks/money-rank:
    get:
      operationId: getStockMoneyRank
      responses:
        '200': {description: Stock money rank}
  /api/v1/market/stocks/{code}/money-trend:
    get:
      operationId: getStockMoneyTrend
      responses:
        '200': {description: Stock money trend}
  /api/v1/market/long-tiger:
    get:
      operationId: getLongTigerRank
      responses:
        '200': {description: Long tiger rank}
  /api/v1/market/stocks/research-reports:
    get:
      operationId: listStockResearchReports
      responses:
        '200': {description: All recent stock research reports}
  /api/v1/market/stocks/{code}/research-reports:
    get:
      operationId: getStockResearchReports
      responses:
        '200': {description: Stock research reports}
  /api/v1/market/stocks/notices:
    get:
      operationId: listStockNotices
      responses:
        '200': {description: All recent stock notices}
  /api/v1/market/stocks/{code}/notices:
    get:
      operationId: getStockNotices
      responses:
        '200': {description: Stock notices}
  /api/v1/market/industries/research-reports:
    get:
      operationId: listIndustryResearchReports
      responses:
        '200': {description: All recent industry research reports}
  /api/v1/market/industries/{code}/research-reports:
    get:
      operationId: getIndustryResearchReports
      responses:
        '200': {description: Industry research reports}
  /api/v1/market/dictionary:
    get:
      operationId: getMarketDictionary
      responses:
        '200': {description: Market dictionary}
  /api/v1/market/sentiment/weighted:
    post:
      operationId: analyzeWeightedSentiment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SentimentRequest'}
      responses:
        '200': {description: Weighted sentiment}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/market/hot/words:
    get:
      operationId: listMarketHotWords
      parameters:
      - name: hours
        in: query
        schema: {type: integer, minimum: 1, maximum: 72, default: 24}
      - name: baselineDays
        in: query
        schema: {type: integer, minimum: 3, maximum: 30, default: 7}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Explainable recent market hot words
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HotWordsEnvelope'}
        '400': {$ref: '#/components/responses/MarketDataBadRequest'}
  /api/v1/market/hot/stocks:
    get:
      operationId: listHotStocks
      responses:
        '200': {description: Hot stocks}
  /api/v1/market/hot/events:
    get:
      operationId: listHotEvents
      responses:
        '200': {description: Hot events}
  /api/v1/market/hot/topics:
    get:
      operationId: listHotTopics
      responses:
        '200': {description: Hot topics}
  /api/v1/market/calendars/investment:
    get:
      operationId: getInvestmentCalendar
      responses:
        '200': {description: Investment calendar}
  /api/v1/market/calendars/cls:
    get:
      operationId: getCLSCalendar
      responses:
        '200': {description: CLS calendar}
  /api/v1/market/breadth:
    get:
      operationId: getMarketBreadth
      responses:
        '200':
          description: Market breadth evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketBreadthEnvelope'}
  /api/v1/market/fund-flows:
    get:
      operationId: listMarketFundFlows
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          enum: [sector, concept]
      - name: date
        in: query
        deprecated: true
        description: Compatibility parameter; the public source only serves its latest trading day.
        schema: {type: string, format: date}
      - name: sort
        in: query
        schema:
          type: string
          enum: [netamount, main_ratio, super_large_netamount, large_netamount, medium_netamount, small_netamount,
            change_pct, inamount, outamount, avg_changeratio]
      - name: limit
        in: query
        schema: {type: integer}
      responses:
        '200':
          description: Sector or concept fund-flow evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FundFlowEnvelope'}
        '400': {$ref: '#/components/responses/MarketDataBadRequest'}
  /api/v1/market/fund-flows/{code}/timeline:
    get:
      operationId: getMarketFundFlowTimeline
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string, pattern: '^BK[0-9]{4}$'}
      responses:
        '200':
          description: Latest trading-session minute fund-flow timeline for a sector or concept
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FundFlowTimelineEnvelope'}
        '400': {$ref: '#/components/responses/MarketDataBadRequest'}
  /api/v1/market/futures/positions:
    get:
      operationId: listFuturesPositions
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
          enum: [IF, IH, IC, IM]
      - name: date
        in: query
        schema: {type: string, format: date}
      responses:
        '200':
          description: CFFEX aggregate long/short position trend
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FuturesPositionsEnvelope'}
        '400': {$ref: '#/components/responses/MarketDataBadRequest'}
  /api/v1/market/margin:
    get:
      operationId: getMarginTrading
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum: [market, security]
      - name: code
        in: query
        schema: {type: string}
      - name: date
        in: query
        schema: {type: string, format: date}
      responses:
        '200':
          description: SSE and SZSE margin-financing evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarginEnvelope'}
        '400': {$ref: '#/components/responses/MarketDataBadRequest'}
  /api/v1/instruments/{code}/auction:
    get:
      operationId: getInstrumentAuction
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      - name: assetType
        in: query
        schema:
          type: string
          enum: [stock, index, etf]
      - name: date
        in: query
        schema: {type: string, format: date}
      responses:
        '200':
          description: Call-auction snapshots
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuctionEnvelope'}
        '400': {$ref: '#/components/responses/MarketDataBadRequest'}
  /api/v1/instruments/{code}/trades:
    get:
      operationId: listInstrumentTrades
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      - name: assetType
        in: query
        schema:
          type: string
          enum: [stock, index, etf]
      - name: date
        in: query
        schema: {type: string, format: date}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer}
      responses:
        '200':
          description: Time-and-sales evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TradesEnvelope'}
        '400': {$ref: '#/components/responses/MarketDataBadRequest'}
  /api/v1/instruments/{code}/chart:
    get:
      operationId: getInstrumentChart
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      - name: assetType
        in: query
        schema:
          type: string
          enum: [stock, index, etf]
      - name: market
        in: query
        schema:
          type: string
          enum: [SH, SZ]
      - name: period
        in: query
        schema:
          type: string
          enum: [1m, 5m, 15m, 30m, 60m, day, week, month, quarter, year]
      - name: adjustment
        in: query
        schema:
          type: string
          enum: [none, qfq, hfq]
      - name: from
        in: query
        schema: {type: string, format: date-time}
      - name: to
        in: query
        schema: {type: string, format: date-time}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 5000}
      responses:
        '200':
          description: Unified stock
          index: null
          or exchange-traded-fund chart: null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChartEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/instruments/{code}/drawings:
    get:
      operationId: getInstrumentDrawings
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      - name: assetType
        in: query
        schema:
          type: string
          enum: [stock, index, etf]
      - name: market
        in: query
        schema:
          type: string
          enum: [SH, SZ]
      - name: period
        in: query
        required: true
        schema:
          type: string
          enum: [1m, 5m, 15m, 30m, 60m, day, week, month, quarter, year]
      - name: adjustment
        in: query
        required: true
        schema:
          type: string
          enum: [none, qfq, hfq]
      responses:
        '200':
          description: Current drawing document for the isolated chart scope
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChartDrawingDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: putInstrumentDrawings
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutChartDrawingsRequest'}
      responses:
        '200':
          description: Revised drawing document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChartDrawingDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      operationId: deleteInstrumentDrawings
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      - name: assetType
        in: query
        schema:
          type: string
          enum: [stock, index, etf]
      - name: market
        in: query
        schema:
          type: string
          enum: [SH, SZ]
      - name: period
        in: query
        required: true
        schema:
          type: string
          enum: [1m, 5m, 15m, 30m, 60m, day, week, month, quarter, year]
      - name: adjustment
        in: query
        required: true
        schema:
          type: string
          enum: [none, qfq, hfq]
      - name: expectedRevision
        in: query
        required: true
        schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Soft-deleted drawing document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChartDrawingDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/themes:
    get:
      operationId: listThemes
      parameters:
      - name: date
        in: query
        schema: {type: string, format: date}
      - name: stage
        in: query
        schema:
          type: string
          enum: [观察, 发酵, 加速, 分歧, 退潮]
      - name: q
        in: query
        schema: {type: string}
      - name: sort
        in: query
        schema:
          type: string
          enum: [rank, heat, stage]
          default: rank
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      - name: cursor
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Frozen daily theme ranking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThemeListEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/themes/{id}:
    get:
      operationId: getTheme
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: date
        in: query
        schema: {type: string, format: date}
      responses:
        '200':
          description: Theme identity
          selected snapshot and constituents: null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThemeDetailEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/themes/{id}/daily-snapshots:
    get:
      operationId: listThemeDailySnapshots
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: from
        in: query
        schema: {type: string, format: date}
      - name: to
        in: query
        schema: {type: string, format: date}
      - name: stage
        in: query
        schema:
          type: string
          enum: [观察, 发酵, 加速, 分歧, 退潮]
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      - name: cursor
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Immutable daily lifecycle snapshots
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThemeDailySnapshotsEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/themes/{id}/catalysts:
    get:
      operationId: listThemeCatalysts
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: date
        in: query
        schema: {type: string, format: date}
      - name: status
        in: query
        schema:
          type: string
          enum: [active, disputed, retracted, expired]
      - name: minCredibility
        in: query
        schema: {type: integer, minimum: 0, maximum: 100}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      - name: cursor
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Catalyst timeline with parallel supporting and contradicting source claims
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThemeCatalystsEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/prediction/slots:
    get:
      operationId: listPredictionSlots
      responses:
        '200':
          description: Today slot report timeliness and buy execution state
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PredictionSlotStatus'}
  /api/v1/prediction/analysis-runs:
    get:
      operationId: listPredictionAnalysisRuns
      parameters:
      - name: slot
        in: query
        required: false
        description: Five-minute account identity, e.g. 09:50; omitted reports include all slots
        schema: {type: string}
      description: Lists independent five-minute analysis attempts including archived late reports.
      responses:
        '200':
          description: stock prediction analysis runs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PredictionAnalysisRunSummary'}
  /api/v1/prediction/email/test:
    post:
      operationId: testPredictionEmail
      description: Sends a stock prediction SMTP configuration test message without creating an analysis run or
        simulated trade.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: {type: string}
                from: {type: string}
                smtpHost: {type: string}
                smtpPort: {type: integer}
                smtpUsername: {type: string}
                smtpPassword: {type: string}
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500':
          description: SMTP delivery failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/prediction/analysis-runs/{id}:
    get:
      operationId: getPredictionAnalysisRun
      responses:
        '200':
          description: stock prediction analysis run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionAnalysisRun'}
  /api/v1/prediction/analysis-runs/{id}/rerun:
    post:
      operationId: rerunPredictionAnalysisRun
      description: Retry the latest failed attempt for its scheduled slot in the morning start window. Successful
        and empty reports cannot be rerun.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: New persisted research run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionAnalysisRun'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/prediction/analysis-runs/{id}/audit:
    get:
      operationId: getPredictionAnalysisRunAudit
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Immutable redacted audit detail or an explicit legacy-unavailable result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionAuditDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/prediction/analysis-runs/{id}/audit/export:
    get:
      operationId: exportPredictionAnalysisRunAudit
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Redacted immutable audit ZIP bundle
          content:
            application/zip:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/prediction/recommendations:
    get:
      operationId: listPredictionRecommendations
      parameters:
      - name: slot
        in: query
        required: false
        description: Five-minute account identity, e.g. 09:50; omitted reports include all slots
        schema: {type: string}
      - name: slots
        in: query
        required: false
        description: Comma-separated five-minute account identities for performance views.
        schema: {type: string}
      - name: from
        in: query
        required: false
        schema: {type: string, format: date}
      - name: to
        in: query
        required: false
        schema: {type: string, format: date}
      - name: boughtOnly
        in: query
        required: false
        schema: {type: boolean}
      responses:
        '200':
          description: stock prediction recommendations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PredictionRecommendation'}
  /api/v1/prediction/recommendations/{id}:
    get:
      operationId: getPredictionRecommendation
      description: Reads the stored recommendation detail without waiting for an upstream quote.
      responses:
        '200':
          description: stock prediction recommendation detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionRecommendationDetail'}
  /api/v1/prediction/recommendations/{id}/chart:
    get:
      operationId: getPredictionRecommendationChart
      description: Reads the persisted unadjusted minute cache and never calls an upstream provider.
      responses:
        '200':
          description: Cached stock prediction recommendation minute chart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationChart'}
  /api/v1/prediction/recommendations/{id}/chart/refresh:
    post:
      operationId: refreshPredictionRecommendationChart
      description: Fills missing minute coverage using only enabled providers, refreshes the quote, and returns
        the chart data.
      responses:
        '200':
          description: Refreshed stock prediction recommendation minute chart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationChart'}
        '409':
          description: The same recommendation is already being refreshed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/prediction/account:
    get:
      operationId: getPredictionAccount
      parameters:
      - name: slot
        in: query
        required: false
        description: Five-minute account identity, e.g. 09:50; omitted reports include all slots
        schema: {type: string}
      responses:
        '200':
          description: Isolated stock prediction account with external capital and neutral internal transfers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionAccountOverview'}
  /api/v1/prediction/account/performance:
    get:
      operationId: getPredictionPerformance
      parameters:
      - name: slot
        in: query
        required: false
        description: Five-minute account identity, e.g. 09:50; omitted reports include all slots
        schema: {type: string}
      responses:
        '200':
          description: stock prediction overnight performance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionPerformance'}
  /api/v1/prediction/portfolio/performance:
    get:
      operationId: getPredictionPortfolioPerformance
      parameters:
      - name: slots
        in: query
        required: false
        description: Comma-separated five-minute accounts; omitted selects all 24 accounts.
        schema: {type: string}
      - name: from
        in: query
        required: false
        schema: {type: string, format: date}
      - name: to
        in: query
        required: false
        schema: {type: string, format: date}
      responses:
        '200':
          description: Filterable single-account or equal-weight portfolio TWR and buy-day limit outcomes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionPortfolioPerformance'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/prediction/replays:
    post:
      operationId: createPredictionReplay
      description: Replays one immutable evidence and prompt snapshot with another model configuration without writing
        formal recommendations, trades, positions, or accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePredictionReplayRequest'}
      responses:
        '202':
          description: Replay accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionReplay'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/prediction/replays/{id}:
    get:
      operationId: getPredictionReplay
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Replay state
          immutable result: null
          and comparison summary: null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictionReplay'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/events/ws:
    get:
      operationId: connectEventsWebSocket
      responses:
        '101': {description: Event stream}
      x-websocket: true
components:
  responses:
    BadRequest:
      description: Invalid JSON request or parameters
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    MarketDataBadRequest:
      description: Invalid market-data query parameters
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DataEnvelope'}
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Request conflicts with the current resource revision
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalServerError:
      description: Request failed because of an internal service or storage error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Request is not from the bound loopback origin
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    PredictionSettings:
      type: object
      additionalProperties: false
      required: [revision, config, aiConfigs]
      properties:
        revision: {type: integer, minimum: 1}
        config: {$ref: '#/components/schemas/JsonObject'}
        aiConfigs:
          type: array
          items: {$ref: '#/components/schemas/JsonObject'}
    JsonObject: {type: object, description: Provider- or configuration-defined JSON object whose stable fields are
        not owned by this transport layer.}
    DataEnvelope:
      type: object
      required: [data, source, asOf, fetchedAt, status, errors]
      properties:
        data:
          oneOf:
          - {$ref: '#/components/schemas/JsonObject'}
          - type: array
            items: {$ref: '#/components/schemas/JsonObject'}
        source: {type: string}
        asOf: {type: string, format: date-time}
        fetchedAt: {type: string, format: date-time}
        status:
          type: string
          enum: [ok, partial, empty, stale, unavailable, after_cutoff]
        errors:
          type: array
          items: {$ref: '#/components/schemas/DataSourceError'}
        sources:
          type: array
          items: {$ref: '#/components/schemas/DataSourceState'}
        warnings:
          type: array
          items: {type: string}
        evidenceProfile: {type: string}
        evidenceSetId: {type: string}
    DataSourceError:
      type: object
      required: [provider, message]
      properties:
        provider: {type: string}
        code: {type: string}
        message: {type: string}
    DataSourceState:
      type: object
      required: [provider, status]
      properties:
        provider: {type: string}
        status:
          type: string
          enum: [ok, partial, stale, unavailable, after_cutoff]
        asOf: {type: string, format: date-time}
        availableAt: {type: string, format: date-time}
        sourceRef: {type: string}
        message: {type: string}
    FundRankingItem:
      type: object
      required: [code, name, category, rank]
      properties:
        code: {type: string}
        name: {type: string}
        category:
          type: string
          enum: [all, stock, mixed, bond, index, qdii, fof]
        nav: {type: number, nullable: true}
        navDate: {type: string, format: date}
        dayReturn: {type: number, nullable: true}
        weekReturn: {type: number, nullable: true}
        monthReturn: {type: number, nullable: true}
        threeMonthReturn: {type: number, nullable: true}
        sixMonthReturn: {type: number, nullable: true}
        oneYearReturn: {type: number, nullable: true}
        threeYearReturn: {type: number, nullable: true}
        yearToDateReturn: {type: number, nullable: true}
        sinceInceptionReturn: {type: number, nullable: true}
        scale: {type: number, nullable: true, description: Latest fund scale in CNY.}
        scaleDate: {type: string, format: date}
        rank: {type: integer, minimum: 1}
    FundRankingPage:
      type: object
      required: [items, total, page, pageSize, category, period]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/FundRankingItem'}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        category:
          type: string
          enum: [all, stock, mixed, bond, index, qdii, fof]
        period:
          type: string
          enum: [day, week, month, 3m, 6m, 1y, 3y, ytd, since_inception, scale]
        navDate: {type: string, format: date}
    FundRankingEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/FundRankingPage'}
    ETFRankingItem:
      type: object
      required: [code, name, market, category, rank]
      properties:
        code: {type: string}
        name: {type: string}
        market:
          type: string
          enum: [SH, SZ]
        category:
          type: string
          enum: [broad, industry, cross_border, bond, commodity, money]
        price: {type: number, nullable: true}
        changeRate: {type: number, nullable: true}
        amount: {type: number, nullable: true}
        turnoverRate: {type: number, nullable: true}
        nav: {type: number, nullable: true}
        navDate: {type: string, format: date}
        premiumRate: {type: number, nullable: true}
        shares: {type: number, nullable: true}
        scale: {type: number, nullable: true}
        netInflow: {type: number, nullable: true}
        quoteTime: {type: string, format: date-time}
        rank: {type: integer, minimum: 1}
    ETFRankingPage:
      type: object
      required: [items, total, page, pageSize, category, sort]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ETFRankingItem'}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        category:
          type: string
          enum: [all, broad, industry, cross_border, bond, commodity, money]
        sort:
          type: string
          enum: [changeRate, amount, turnoverRate, premiumRate, scale, netInflow]
    ETFRankingEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/ETFRankingPage'}
    ETFSearchEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data:
            type: array
            items: {$ref: '#/components/schemas/ETFRankingItem'}
    ETFHolding:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        weight: {type: number, nullable: true}
        asOf: {type: string, format: date}
    ETFDetail:
      allOf:
      - {$ref: '#/components/schemas/ETFRankingItem'}
      - type: object
        required: [trackingIndex, managementFee, holdings, chartInstrument]
        properties:
          trackingIndex: {type: string}
          managementFee: {type: number, nullable: true}
          listDate: {type: string, format: date}
          holdings:
            type: array
            items: {$ref: '#/components/schemas/ETFHolding'}
          chartInstrument: {$ref: '#/components/schemas/InstrumentID'}
    ETFDetailEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/ETFDetail'}
    MarketBreadthData:
      type: object
      required: [total, advances, declines, flat, limitUps, limitDowns, medianChangePct]
      properties:
        total: {type: integer}
        advances: {type: integer}
        declines: {type: integer}
        flat: {type: integer}
        limitUps: {type: integer}
        limitDowns: {type: integer}
        newHighs: {type: integer, nullable: true}
        newLows: {type: integer, nullable: true}
        medianChangePct: {type: number}
    HotWordsWindow:
      type: object
      required: [from, to, hours]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        hours: {type: integer}
    HotWordsBaseline:
      type: object
      required: [from, to, requestedDays, effectiveDays, documentCount, available, mode]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        requestedDays: {type: integer}
        effectiveDays: {type: integer}
        documentCount: {type: integer}
        available: {type: boolean}
        mode:
          type: string
          enum: [burst, coverage_fallback]
    HotWordsSentiment:
      type: object
      required: [score, category, description, positiveCount, negativeCount]
      properties:
        score: {type: number, minimum: -100, maximum: 100}
        category: {type: integer, minimum: 0, maximum: 2}
        description: {type: string}
        positiveCount: {type: integer}
        negativeCount: {type: integer}
    HotWordRepresentativeNews:
      type: object
      required: [id, title, excerpt, source, publishedAt]
      properties:
        id: {type: integer}
        title: {type: string}
        excerpt: {type: string}
        source: {type: string}
        publishedAt: {type: string, format: date-time}
        url: {type: string, format: uri}
    HotWordItem:
      type: object
      required: [rank, word, score, documentCount, occurrenceCount, documentShare, baselineDocumentCount, sourceCount,
        sources, latestAt, confidence, representativeNews]
      properties:
        rank: {type: integer}
        word: {type: string}
        score: {type: number}
        documentCount: {type: integer}
        occurrenceCount: {type: integer}
        documentShare: {type: number, minimum: 0, maximum: 1}
        baselineDocumentCount: {type: integer}
        burstRatio: {type: number, nullable: true}
        growthPct: {type: number, nullable: true}
        sourceCount: {type: integer}
        sources:
          type: array
          items: {type: string}
        latestAt: {type: string, format: date-time}
        confidence:
          type: string
          enum: [low, medium, high]
        representativeNews:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/HotWordRepresentativeNews'}
    HotWordsData:
      type: object
      required: [window, baseline, currentDocumentCount, sentiment, items]
      properties:
        window: {$ref: '#/components/schemas/HotWordsWindow'}
        baseline: {$ref: '#/components/schemas/HotWordsBaseline'}
        currentDocumentCount: {type: integer}
        sentiment: {$ref: '#/components/schemas/HotWordsSentiment'}
        items:
          type: array
          items: {$ref: '#/components/schemas/HotWordItem'}
    FundFlowRow:
      type: object
      required: [code, name, netAmount]
      properties:
        code: {type: string}
        name: {type: string}
        netAmount: {type: number}
        inAmount: {type: number, nullable: true, deprecated: true}
        outAmount: {type: number, nullable: true, deprecated: true}
        changePct: {type: number, nullable: true}
        mainNetRatio: {type: number, nullable: true}
        superLargeNetAmount: {type: number, nullable: true}
        largeNetAmount: {type: number, nullable: true}
        mediumNetAmount: {type: number, nullable: true}
        smallNetAmount: {type: number, nullable: true}
    FundFlowTimelinePoint:
      type: object
      required: [at, mainNetAmount, superLargeNetAmount, largeNetAmount, mediumNetAmount, smallNetAmount]
      properties:
        at: {type: string, format: date-time}
        mainNetAmount: {type: number}
        superLargeNetAmount: {type: number}
        largeNetAmount: {type: number}
        mediumNetAmount: {type: number}
        smallNetAmount: {type: number}
    FundFlowTimelineData:
      type: object
      required: [code, points]
      properties:
        code: {type: string}
        name: {type: string}
        tradingDate: {type: string, format: date}
        points:
          type: array
          items: {$ref: '#/components/schemas/FundFlowTimelinePoint'}
    FuturesPositionRow:
      type: object
      required: [tradeDate, settlePrice, longPosition, longChange, shortPosition, shortChange, netPosition, indexClose,
        indexChange, basis]
      properties:
        tradeDate: {type: string, format: date}
        settlePrice: {type: number}
        longPosition: {type: integer, format: int64}
        longChange: {type: integer, format: int64}
        shortPosition: {type: integer, format: int64}
        shortChange: {type: integer, format: int64}
        netPosition: {type: integer, format: int64}
        indexClose: {type: number}
        indexChange: {type: number}
        basis: {type: number}
    FuturesPositionsData:
      type: object
      required: [variety, varietyName, contractCode, indexCode, rows]
      properties:
        variety:
          type: string
          enum: [IF, IH, IC, IM]
        varietyName: {type: string}
        contractCode: {type: string}
        indexCode: {type: string}
        rows:
          type: array
          items: {$ref: '#/components/schemas/FuturesPositionRow'}
    MarginRow:
      type: object
      required: [date, financingBalance, securitiesBalance, marginBalance, financingBuy, securitiesSell]
      properties:
        code: {type: string}
        name: {type: string}
        date: {type: string, format: date}
        financingBalance: {type: number}
        securitiesBalance: {type: number}
        marginBalance: {type: number}
        financingBuy: {type: number}
        securitiesSell: {type: number, description: Securities lending sell volume in shares or fund units.}
    MarginData:
      type: object
      required: [scope, rows]
      properties:
        scope:
          type: string
          enum: [market, security]
        rows:
          type: array
          items: {$ref: '#/components/schemas/MarginRow'}
    AuctionSnapshot:
      type: object
      required: [time, price, matchedVolume, matchedAmount]
      properties:
        time: {type: string}
        price: {type: number}
        matchedVolume: {type: number}
        matchedAmount: {type: number}
        unmatchedVolume: {type: number, nullable: true}
        unmatchedSide: {type: string}
    AuctionData:
      type: object
      required: [code, assetType, date, snapshots]
      properties:
        code: {type: string}
        assetType:
          type: string
          enum: [stock, index, etf]
        date: {type: string, format: date}
        snapshots:
          type: array
          items: {$ref: '#/components/schemas/AuctionSnapshot'}
        finalSnapshot: {$ref: '#/components/schemas/AuctionSnapshot'}
        auctionStrength: {type: number, nullable: true}
        gapPct: {type: number, nullable: true}
    TradeTick:
      type: object
      required: [time, price, volume, amount]
      properties:
        time: {type: string}
        price: {type: number}
        volume: {type: number}
        amount: {type: number}
        side:
          type: string
          enum: [buy, sell, neutral]
    TradesData:
      type: object
      required: [code, assetType, date, items]
      properties:
        code: {type: string}
        assetType:
          type: string
          enum: [stock, index, etf]
        date: {type: string, format: date}
        items:
          type: array
          items: {$ref: '#/components/schemas/TradeTick'}
        nextCursor: {type: string}
    MarketBreadthEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/MarketBreadthData'}
    HotWordsEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/HotWordsData'}
    FundFlowEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data:
            type: array
            items: {$ref: '#/components/schemas/FundFlowRow'}
    FundFlowTimelineEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/FundFlowTimelineData'}
    FuturesPositionsEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/FuturesPositionsData'}
    MarginEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/MarginData'}
    AuctionEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/AuctionData'}
    TradesEnvelope:
      allOf:
      - {$ref: '#/components/schemas/DataEnvelope'}
      - type: object
        required: [data]
        properties:
          data: {$ref: '#/components/schemas/TradesData'}
    InstrumentID:
      type: object
      required: [assetType, market, code]
      properties:
        assetType:
          type: string
          enum: [stock, index, etf]
        market:
          type: string
          enum: [SH, SZ, BJ, CFFEX]
        code: {type: string}
    ChartBar:
      type: object
      required: [time, open, high, low, close, volume, amount]
      properties:
        time: {type: string, format: date-time}
        open: {type: number}
        high: {type: number}
        low: {type: number}
        close: {type: number}
        volume: {type: number}
