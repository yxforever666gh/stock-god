        netAssetValue: {type: number}
        cumulativeExternalCapital: {type: number}
        netInternalTransfer: {type: number}
        netProfit: {type: number}
        cumulativeCapitalReturn: {type: number}
        returnRate: {type: number}
        valuationBasis: {type: string}
